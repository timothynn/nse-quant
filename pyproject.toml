[project]
name = "nse-quant"
version = "0.1.0"
description = "Quantitative analysis toolkit for the Nairobi Securities Exchange"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Timothy N." }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0,<3.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "pytz>=2024.1",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "streamlit>=1.30",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
    "xgboost>=2.0",
    "joblib>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]
optimizer = [
    "cvxpy>=1.4",
]
ta = [
    "pandas-ta>=0.3.14b0",
]
lstm = [
    "torch>=2.1",
]

[project.scripts]
nse-quant = "nse_quant.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nse_quant*"]

[tool.setuptools.package-data]
nse_quant = ["data/sample/**/*.csv"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
